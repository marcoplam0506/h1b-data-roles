:root[data-theme="dark"]{

*{box-sizing:border-box}
body{margin:0;background:var(--plane);color:var(--ink);font:15px/1.6 var(--sans)}
.wrap{max-width:900px;margin:0 auto;padding:34px 20px 70px}
h1{font-size:24px;margin:0 0 6px;letter-spacing:-.01em}
.sub{color:var(--ink2);font-size:14px;margin:0 0 6px}
.meta{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin:0 0 30px}

figure{margin:0 0 30px;background:var(--surface);border:1px solid var(--ring);border-radius:8px;padding:20px 20px 16px}
figcaption{margin:0 0 3px;font-size:16px;font-weight:600}
.why{margin:0 0 16px;font-size:13px;color:var(--ink2);line-height:1.5}
svg{display:block;width:100%;height:auto;overflow:visible}
.lbl{font-family:var(--sans);font-size:12.5px;fill:var(--ink2)}
.val{font-family:var(--mono);font-size:12px;fill:var(--ink);font-weight:500}
.ax{font-family:var(--mono);font-size:11px;fill:var(--muted)}
.gl{stroke:var(--grid);stroke-width:1}
.base{stroke:var(--axis);stroke-width:1}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 12px;font-size:12.5px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.note{font-size:11.5px;color:var(--muted);margin:10px 0 0;line-height:1.5}
table{border-collapse:collapse;width:100%;font-size:12.5px;margin-top:12px}
th,td{text-align:right;padding:5px 8px;border-bottom:1px solid var(--grid);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500;font-family:var(--mono);font-size:11px}
details{margin-top:10px}
summary{cursor:pointer;font-size:12px;color:var(--muted);font-family:var(--mono)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--plane);
  font:12px/1.45 var(--sans);padding:6px 9px;border-radius:5px;opacity:0;transition:opacity .1s;z-index:9;max-width:230px}
.tip.on{opacity:1}
</style>

  table(f, ["角色", "样本", "10%", "25%", "中位", "75%", "90%"],
    data.map(d => [d.role, d.n.toLocaleString(), "$" + d.p10.toLocaleString(),
      "$" + d.p25.toLocaleString(), "$" + d.p50.toLocaleString(),
      "$" + d.p75.toLocaleString(), "$" + d.p90.toLocaleString()]));
})();

/* ---------- ④ ---------- */
(() => {
  const f = fig("④ 整个行业按职级分层，不是按角色",
    "行是角色，列是政府认定的职级，颜色是实际薪资三年变化。每一行都是同一个梯度：入门级跌，资深涨。这说明分化的主轴是资历，不是你叫什么职位。");
  const data = D.heatmap, LV = ["I","II","III","IV"];
  const lo = -14, hi = 20;
  const col = v => {
    if (v === null) return "var(--neutral)";
    if (v >= 0) { const t = Math.min(v / hi, 1); return `color-mix(in oklab, var(--s1) ${18 + t * 72}%, var(--neutral))`; }
    const t = Math.min(v / lo, 1); return `color-mix(in oklab, #d03b3b ${18 + t * 72}%, var(--neutral))`;
  };
  const lg = document.createElement("div"); lg.className = "legend";
  lg.innerHTML = `<span><i style="background:${col(-12)}"></i>实际薪资下跌</span>`
    + `<span><i style="background:var(--neutral)"></i>持平</span>`
    + `<span><i style="background:${col(16)}"></i>实际薪资上涨</span>`;
  f.appendChild(lg);
  const W = 820, L0 = 168, cw = (W - L0 - 8) / 4, ch = 46, H = data.length * ch + 30;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  LV.forEach((L, i) => {
    const t = el("text", { x: L0 + i * cw + cw / 2, y: 14, "text-anchor": "middle", class: "ax" });
    t.textContent = "Level " + L; svg.append(t);
  });
  data.forEach((d, r) => {
    const y = 24 + r * ch;
    const lab = el("text", { x: L0 - 12, y: y + ch / 2 + 4, "text-anchor": "end", class: "lbl" });
    lab.textContent = d.role; svg.append(lab);
    LV.forEach((L, i) => {
      const v = d[L], n = d[L + "_n"], x = L0 + i * cw;
      const rect = el("rect", { x: x + 1, y: y + 1, width: cw - 3, height: ch - 3, rx: 4, fill: col(v) });
      hover(rect, `<b>${d.role} · Level ${L}</b><br>实际薪资变化 ${v > 0 ? "+" : ""}${v}%<br>样本 ${n.toLocaleString()} 件`
        + (n < 120 ? "<br><i>样本偏小，谨慎解读</i>" : ""));
      const t = el("text", { x: x + cw / 2, y: y + ch / 2 + 5, "text-anchor": "middle", class: "val" });
      t.setAttribute("fill", Math.abs(v) > 8 ? "#fff" : "var(--ink)");
      t.textContent = (v > 0 ? "+" : "") + v + "%";
      svg.append(rect, t);
    });
  });
  f.appendChild(svg);
  const nt = document.createElement("p"); nt.className = "note";
  nt.textContent = "Data Architect 各格样本仅 24–114 件，波动大，不宜单独下结论。其余各格样本 249–5,907 件。";
  f.appendChild(nt);
  table(f, ["角色", "Level I", "II", "III", "IV"],
    data.map(d => [d.role, ...LV.map(L => (d[L] > 0 ? "+" : "") + d[L] + "%")]));
})();

/* ---------- ⑤ ---------- */
(() => {
  const T = D.titles;
  const f = fig("⑤ 为什么这份数据必须做文本清洗",
    `176 万条申请里有 ${T.unique.toLocaleString()} 种不同的职位名写法。前 100 种只覆盖 30.5%，要覆盖一半得看到第 1,000 种。${T.once.toLocaleString()} 种写法只出现过一次，占全部写法的 66%。任何靠关键词直接筛的做法，在这条曲线面前都站不住。`);
  const pts = T.curve, W = 820, H = 300, L = 60, R = 56, TP = 14, B = 42;
  const PW = W - L - R, PH = H - TP - B;
  const lx = v => L + (Math.log10(v) / Math.log10(T.unique)) * PW;
  const ly = p => TP + (1 - p / 100) * PH;
  const svg = el("svg", { viewBox: `0 0 ${W} ${H}`, role: "img" });
  [0, 25, 50, 75, 100].forEach(p => {
    svg.append(el("line", { x1: L, y1: ly(p), x2: W - R, y2: ly(p), class: p === 0 ? "base" : "gl" }));
    const t = el("text", { x: L - 10, y: ly(p) + 4, "text-anchor": "end", class: "ax" });
    t.textContent = p + "%"; svg.append(t);
  });
  [1, 10, 100, 1000, 10000, 100000].forEach(k => {
    svg.append(el("line", { x1: lx(k), y1: TP, x2: lx(k), y2: ly(0), class: "gl" }));
    const t = el("text", { x: lx(k), y: H - 22, "text-anchor": "middle", class: "ax" });
    t.textContent = k >= 1000 ? (k / 1000) + "K" : String(k); svg.append(t);
  });
  svg.append(el("path", {
    d: pts.map((p, i) => (i ? "L" : "M") + lx(p.k) + " " + ly(p.pct)).join(" "),
    fill: "none", stroke: "var(--s1)", "stroke-width": 2,
    "stroke-linejoin": "round", "stroke-linecap": "round" }));
  pts.forEach(p => {
    const c = el("circle", { cx: lx(p.k), cy: ly(p.pct), r: 4.5, fill: "var(--s1)",
      stroke: "var(--surface)", "stroke-width": 2 });
    hover(c, `前 <b>${p.k.toLocaleString()}</b> 种职位名<br>覆盖 <b>${p.pct}%</b> 的申请`);
    svg.append(c);
  });
  [100, 1000].forEach(k => {
    const p = pts.find(x => x.k === k); if (!p) return;
    const t = el("text", { x: lx(k) + 9, y: ly(p.pct) - 9, class: "val" });
    t.textContent = `前 ${k.toLocaleString()} 种 → ${p.pct}%`; svg.append(t);
  });
  const xt = el("text", { x: L + PW / 2, y: H - 4, "text-anchor": "middle", class: "ax" });
  xt.textContent = "不重复职位名数量（对数轴）"; svg.append(xt);
  f.appendChild(svg);
  table(f, ["前 N 种写法", "覆盖申请量"], pts.map(p => [p.k.toLocaleString(), p.pct + "%"]));
})();


</script>
